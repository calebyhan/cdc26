[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mortgage-ews"
version = "0.1.0"
description = "Mortgage complaint early-warning ingestion and entity resolution"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "rapidfuzz>=3.14,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.15.7", "black==26.3.1", "pre-commit>=4,<5"]

[project.scripts]
ews-complaints = "ews.ingest.complaints:main"
ews-resolve = "ews.resolve.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ews"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
target-version = ["py311"]
include = '/(src|tests)/.*\.py$'
