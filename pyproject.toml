[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "not-my-debt"
version = "0.1.0"
description = "Source-linked medical billing evidence reconciliation"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.50,<2", "plotly>=6,<7", "pandas>=2.2,<3", "pydantic>=2,<3", "pypdf>=6,<7", "requests>=2.32,<3", "openai>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/not_my_debt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
