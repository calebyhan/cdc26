  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  const seg = (t, a, b) => clamp01((t - a) / (b - a));

  const cents = (v) => Number(v.replace(/[$,]/g, "")) * 100;
  const usd = (c, exact) => {
    const v = c / 100;

  const dateText = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

  // Waterfall from the engine ledger; the receipt bar collapses as the receipt is removed.

  function drawWaterfall() {
    const g = $("g-wf");
    if (P.wfA < 0.01) { g.innerHTML = ""; return; }
    const supported = lerp(WO.supported, W.supported, P.rcpt);
    const steps = [];
    let run = 0;
    for (const row of W.ledger) {
      if (row.label === "Balance supported by supplied records") continue;
      if (row.label === "Provider statement balance") { run = row.cents; steps.push({ label: SHORT[row.label], lo: 0, hi: row.cents, v: row.cents, color: "#173c36" }); continue; }
      if (row.cents === 0 && row.label !== "Provider charges") continue;
      const isReceipt = row.label.startsWith("Matching");
      const delta = isReceipt ? row.cents * P.rcpt : row.cents;
      const nxt = run + delta;
      steps.push({ label: SHORT[row.label] || row.label, lo: Math.min(run, nxt), hi: Math.max(run, nxt), v: delta, color: delta > 0 ? "#9fb3aa" : "#2e7d70", receipt: isReceipt });

        if (label) lg += svg("text", { x: 1130 + i * 46 + 22, y: 660, "text-anchor": "middle", "font-size": 13, fill: "#5f6f65" }, label);
      });
      lg += svg("text", { x: 1130, y: 614, "font-size": 13, "font-weight": 650, fill: "#173c36" }, P.adjT < 0.5 ? "Complaints per 100k, 2025" : "Observed ÷ expected");
    }
    if (z > 0.5) {
      [["nonprofit", "Nonprofit"], ["for_profit", "For-profit"], ["government", "Government"]].forEach(([key, label], i) => {
        lg += svg("circle", { cx: 1290, cy: 212 + i * 26, r: 6, fill: "#fffdf8", stroke: OWN[key], "stroke-width": 2 }) + svg("text", { x: 1304, y: 217 + i * 26, "font-size": 14, fill: "#173c36" }, label);
      });
      lg += svg("circle", { cx: 1290, cy: 212 + 3 * 26, r: 6, fill: "#5f6f65" }) + svg("text", { x: 1304, y: 217 + 3 * 26, "font-size": 14, fill: "#173c36" }, "Filled: policy linked");
      lg = `<g opacity="${P.hospA}">${lg}</g>`;
    }
    $("atlas-legend").innerHTML = lg;
    $("atlas-scatter").innerHTML = P.scatA > 0.01 ? `<g opacity="${P.scatA}">${scatterSvg(P.scatT)}</g>` : "";
  }

  // Atlas HTML layers (static content; visibility and reveal handled in drawAtlas).
  let sideMode = -1;
  function updateAtlasSide() {
    const mode = P.adjT >= 0.5 ? 1 : 0;
    if (mode === sideMode) return;
    sideMode = mode;
    const list = mode ? AT.topAdjusted : AT.topRate;
    $("atlas-side").innerHTML = `<h4>${mode ? "Observed ÷ expected · 100+ complaints" : "Highest rates · per 100k"}</h4>` +
      list.map((s, i) => `<div class="rank ${i < 3 ? "hot" : ""}"><b>${s.abbr}</b><small>${int(s.n)} complaints</small><strong>${mode ? s.value.toFixed(2) + "×" : s.value.toFixed(1)}</strong></div>`).join("");
  }
  $("hosp-card").innerHTML = `<p class="kind">Filed financial-assistance policy</p><h3>${dh.name}</h3>
    <div class="row"><span>Location</span><strong>${dh.city}, GA · nonprofit</strong></div>
    <div class="row"><span>Free care</span><strong>Up to ${dh.free}% of poverty level</strong></div>
    <div class="row"><span>Discounted care</span><strong>Up to ${dh.discount}% of poverty level</strong></div>
    <div class="row"><span>Policy notice on bills</span><strong>${dh.noticeOnBills ? "Yes" : "No"}</strong></div>
    <div class="row"><span>Collection actions before eligibility is checked</span><strong>${dh.ecasBefore.length ? dh.ecasBefore.length + " permitted" : dh.noEcasBefore ? "None reported" : "Not reported"}</strong></div>
    <p class="from">From ${dh.filer}’s Form 990 Schedule H, tax year ${dh.taxYear}. Self-reported; linked by ZIP code and name.</p>`;
  $("chat").innerHTML = `<p class="who">Ask the guide · Google Gemini</p>
    <div class="bubble q" data-at="0">${AT.guide.question}</div>
    <div data-at="0.25">${AT.guide.tools.map((t) => `<span class="tool">⚙ ${t}</span>`).join("")}</div>
    <div class="bubble a" data-at="0.5">${AT.guide.answer.map((line) => `<p>${line}</p>`).join("")}<span class="opened">Opened Georgia on the map</span></div>`;
  $("atlas-tallies").innerHTML = [
    [int(AC.cfpb_records), "CFPB medical-debt complaint records, Jan 2021 – Aug 2026"],
    [`${Math.round((100 * AC.county_complaints_mapped) / AC.county_complaints)}%`, `of 2023–2025 complaints placed in a county by ZIP code (${int(AC.county_complaints_mapped)} of ${int(AC.county_complaints)})`],
    [`${int(AC.cms_nonprofit_with_policy)}`, `of ${int(AC.cms_nonprofit)} nonprofit hospitals linked to a filed Schedule H policy (${Math.round((100 * AC.cms_nonprofit_with_policy) / AC.cms_nonprofit)}%)`],
    [`${AT.linkReview.second[0]} / ${AT.linkReview.second[1]}`, `facility links plausible in a fresh random review, after fixing the ${AT.linkReview.first[1] - AT.linkReview.first[0]} errors found in the first ${AT.linkReview.first[1]}`],
  ].map(([n, t]) => `<div class="tally"><strong>${n}</strong><p>${t}</p></div>`).join("");

  function frame(now) {
    if (!anim && !dirty) { lastNow = now; requestAnimationFrame(frame); return; }
    dirty = false;
    const dt = Math.min(100, now - lastNow);
    lastNow = now;
    if (anim) {
      anim.t += dt * rate;
      let done = true;
      const clockKeys = new Set(anim.clocks.map((c) => c.k));
      const u = Math.min(1, anim.t / anim.dur);
      for (const k of Object.keys(anim.to)) {
        if (clockKeys.has(k) || DISCRETE.has(k)) continue;
        P[k] = lerp(anim.from[k], anim.to[k], ease(u));
      }
      if (u < 1) done = false;
      for (const c of anim.clocks) {
        const cu = clamp01((anim.t - (c.delay || 0)) / c.dur);
        P[c.k] = lerp(c.from, c.to, cu);
        if (cu < 1) done = false;
      }
      if (done) { Object.assign(P, anim.to); anim = null; }
    }
    updateDocs();
    drawTimeline();
    drawLinks();
    drawDrill();
    updateTable();
    drawWaterfall();
    updateFinding();
    drawHeat();
    drawBench();
    drawLayouts();
    updateAtlasSide();
    drawAtlas();
    updatePacket();
    updateCommunity();
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  const notes = $("notes");
  function toggleNotes() {
    notes.hidden = !notes.hidden;
    $("notes-btn").setAttribute("aria-expanded", String(!notes.hidden));
  }
  stageEl.addEventListener("click", (e) => { if (!e.target.closest("a, button, footer")) next(); });
  $("next").addEventListener("click", (e) => { e.stopPropagation(); next(); });
  $("prev").addEventListener("click", (e) => { e.stopPropagation(); prev(); });
  function replay() { Object.assign(P, beat > 0 ? stateAt(beat - 1) : DEFAULTS); go(beat, true); }
  $("replay").addEventListener("click", (e) => { e.stopPropagation(); replay(); });
  $("notes-btn").addEventListener("click", (e) => { e.stopPropagation(); toggleNotes(); });
  const RATES = [0.5, 1, 2, 4];
  $("rate").addEventListener("click", (e) => {
    e.stopPropagation();
    rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
    $("rate").textContent = `${rate}×`;
  });
  window.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target.closest("a, button, input, textarea, select") && [" ", "Enter"].includes(e.key)) return;
    if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === "Home") go(0, false);
    else if (e.key === "End") go(BEATS.length - 1, false);
    else if (/^[1-9]$/.test(e.key)) {
      const first = BEATS.findIndex((b) => b.scene === +e.key - 1);
      if (first >= 0) go(first, true);
    } else if (e.key === "r" || e.key === "R") replay();
    else if (e.key === "s" || e.key === "S") $("rate").click();
    else if (e.key === "n" || e.key === "N") toggleNotes();
    else if (e.key === "Escape" && !notes.hidden) toggleNotes();
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.().catch(() => { /* needs a user gesture */ });
    }
  });

  let lastNow = performance.now();
  window.addEventListener("resize", () => { dirty = true; });
  window.addEventListener("hashchange", () => {
    const match = /^#b=(\d+)$/.exec(location.hash);
    go(match ? Number(match[1]) : 0, false);
  });
  const m = /^#b=(\d+)$/.exec(location.hash);
  go(m ? +m[1] : 0, !m);
  requestAnimationFrame((t) => { lastNow = t; frame(t); });
})();
</script>
</body>
</html>
